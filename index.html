 {id:'m05',module:5,level:4,title:'有限產能、瓶頸與換線工時',concept:'名目產能不是可用產能。要扣掉停機、已承諾產能、換線與清洗，再看品項相容性、工作日與品檢物流前置。',why:'只依每日日產量排訂單，容易把同一天工時重複出售。',terms:['有限產能排程','交期緩衝'],example:'每日 480 分鐘，停機 120 分、既有作業 60 分，可用 300 分；還得扣換線清洗時間。',inspection:['F-A 的標準日工時 480 分','今日 F-A 的停機分鐘數','F-A 今天已承諾的箱數'],question:'依目前 F-A 資料，今天扣除停機及已承諾產能後，可用生產分鐘數是多少（尚未扣新訂單換線）？',type:'number',answer:s=>{const f=s.factories.find(x=>x.id==='F-A');return nround(Math.max(0,480-(f.downtime[s.date]||0)-(f.reserved[s.date]||0)*(480/f.capacity)))},unit:'分鐘',explain:'480 − 停機分鐘 −（已承諾箱數 × 480 ÷ 基準日產量）。後續仍應扣不同產品的清洗換線工時。',risk:'不是每天都有相同工作時數；國定假日、設備維護與品項換線可能變動。',transfer:'瓶頸產線塞滿時，如何說明哪些訂單要調整？'},
 {id:'m06',module:6,level:2,title:'可用庫存、待驗批次與 FEFO',concept:'帳面數只是起點。真正可用要扣已預留，並排除待驗、隔離、拒收批次；在途品沒有到貨並完成必要驗收前不能當作已可用。',why:'避免帳面數看起來夠，實際發料卻缺料停線。',terms:['FEFO 先到期先出','隔離／待驗'],example:'已放行 5,000 支瓶器、預留 1,300 支，可用 3,700 支；另有隔離 800 支不能算入。',inspection:['瓶器的已放行總數','瓶器批號的已預留量','若有待驗或隔離批次是否被排除'],question:'依目前工作台，PET 瓶本日已放行且扣除預留後的可用量是多少？',type:'number',answer:s=>nround(m(s,'M-BOTTLE').filter(x=>x.status==='released').reduce((t,x)=>t+Math.max(0,x.qty-x.reserved),0)),unit:'支',explain:'只加總 status=released 的每批 qty−reserved；不可以把未放行或未確認到貨計入。',risk:'實務需確認效期、儲位、實盤數及客戶／配方限制；現有模型沒有完整 FEFO 自動領料。',transfer:'ERP 帳面與盤點不符時，如何避免直接誤改庫存？'},
 {id:'m07',module:7,level:4,title:'代工廠相容性、檔期與送廠',concept:'委外排程至少要確認工廠有核准的製程能力、可用檔期、物料送達時間、品檢與物流安排。能做同類產品不等於能隨時接單。',why:'從帳面轉廠雖容易，但未確認的外包檔期可能把風險轉移到其他廠。',terms:['委外製令','有限產能排程'],example:'代工廠 B 可以做芒果飲，但檔期未確認，系統只可列為條件式預案；C 可做百香果飲且檔期確認。',inspection:['三家工廠各自核可的產品','各家工廠 confirmed 檔期狀態','跨廠品檢及物流天數'],question:'以目前示範資料，百香果飲 P-P 要在「製程相容且檔期已確認」前提下，應選哪家工廠？',type:'pick',choices:[['示範自有灌裝線 A','F-A'],['示範代工廠 B','F-B'],['示範代工廠 C','F-C']],answer:s=>{const f=s.factories.find(x=>x.compatible.includes('P-P')&&x.confirmed);return f?.id||'UNKNOWN'},explain:'需同時滿足品項相容與已確認檔期；轉廠還要評估送廠、驗收、在製品與批准。',risk:'當下資料如果沒有任何合格且確認的工廠，答案應是 UNKNOWN，不可強選。',transfer:'當業務要求今天轉廠，你需要拿到哪些書面確認？'},
 {id:'m08',module:8,level:5,title:'食安管理、品質放行與追溯',concept:'GHP 是食品衛生基礎管理；HACCP 是危害分析與控制方法；ISO 22000 是食品安全管理系統標準。三者層次不同，實際義務須依台灣法規、公告類別及工廠適用性確認。',why:'食品品質事件的代價可能遠大於一般交期延誤，生管不能自行解除品質封鎖。',terms:['GHP','HACCP','ISO 22000'],example:'批號 L-M-HOLD 隔離 120 公斤，縱使訂單很急仍不能拿來補料。放行權責必須回到品保授權流程。',inspection:['SO-101 是否存在品質硬封鎖','L-M-HOLD 是否已獲品質放行','已出貨狀態與品質放行是不同欄位'],question:'當原料批號尚在隔離、品保未放行時，哪個行動正確？',type:'pick',choices:[['先用料趕工，稍後補驗收','use'],['保留隔離、由品保確認並調整排程','hold'],['讓業務口頭同意即可使用','sales']],answer:()=> 'hold',explain:'依品質程序先控制風險，追查批號與受影響訂單，並由品保依授權程序處置。',risk:'本系統不是品質授權平台，也未取代真實法規判斷。部分 2025 GHP 修正條文分階段施行。',transfer:'食品品質有疑慮但客戶催出貨，你會向主管怎麼說？'},
 {id:'m09',module:9,level:2,title:'日常進度、計畫與績效差異',concept:'生管要看計畫量、累計良品、在製量及剩餘待投入量。良品完成不等於品保放行，更不代表已出貨。每天比較昨天計畫與實際，找出缺口原因。',why:'先看差異才能提早協調，不必等到交期當天才知道來不及。',terms:['計畫達成率','達交率'],example:'訂單 1,000 箱、已完成良品 800 箱、在製 40 箱，尚待投入 160 箱。計畫 300、良品 270＝90% 達成率。',inspection:['SO-101 總訂單量','SO-101 良品與在製量','同一張訂單的已出貨箱數'],question:'依目前 SO-101 的良品與在製進度，尚待投入生產的數量是多少？',type:'number',answer:s=>E.orderRemaining(o(s,'SO-101')),unit:'箱',explain:'訂單量 − 已完成良品 − 已列在製量。良品、在製與已出貨互不等同。',risk:'不能把生產完成率當準時達交率，後者必須以承諾交期與出貨證據計算。',transfer:'昨天計畫 300 箱只做出 270 箱，今天如何調整且不掩蓋問題？'},
 {id:'m10',module:10,level:1,title:'ERP 資料鏈與跨部門協作',concept:'ERP 將訂單、BOM、採購、庫存、製令、委外、完工與出貨串成資料流，但各企業的 ERP 版本、核准權限、作業程序不同。系統紀錄有數字不代表資料一定正確。',why:'懂資料從哪來、由誰確認、什麼時候更新，比硬記某套 ERP 按鈕位置更重要。',terms:['ERP','MRP 物料需求計畫'],example:'新訂單要依 BOM 展開物料需求；採購入庫但未驗收放行的原料，不能直接當成生產可用量。',inspection:['訂單頁的 SO-101 數量與交期','物料頁的批次庫存與待驗狀態','完成良品與出貨是兩次不同的資料動作'],question:'對於未提供版本與權限資料的 ERP 系統，以下哪個判斷正確？',type:'pick',choices:[['本教學系統已與實際 ERP 串接','connected'],['未取得資料，版本、操作功能及授權仍是 UNKNOWN','unknown'],['生管一定有權直接放行所有原料','qa']],answer:()=> 'unknown',explain:'學習的是 ERP 資料關聯的通用概念，不能把教學模擬當成企業實際版本與職務權限。',risk:'版本與權限不同會影響流程；真實導入須先做資料盤點與權責確認。',transfer:'發現 ERP 資料與現場不符，你會如何確認而非直接改數字？'}

function dataStamp(s){return JSON.stringify([s.scenarioId,s.date,s.orders.map(x=>[x.id,x.qty,x.good,x.wip,x.qa,x.shipped,x.due,x.factoryId]),s.lots.map(x=>[x.id,x.qty,x.reserved,x.status]),s.factories.map(x=>[x.id,x.confirmed,x.capacity,x.downtime,x.reserved]),s.issues.map(x=>[x.id,x.status])]);}
function checkPractice(l,s,p,input,reason){const expected=l.answer(s,p);let ok=false;const value=l.type==='number'?Number(input):String(input);if(l.type==='number')ok=String(input).trim()!==''&&Number.isFinite(value)&&Math.abs(value-expected)<0.011;else ok=value===expected;
if(reason.trim().length<12)ok=false;
const explanation=ok?`已符合目前資料的示範計算／權責條件；${l.explain}`:`目前模型對應的結果為 ${l.type==='number'?num(expected)+' '+(l.unit||''):l.choices.find(x=>x[1]===expected)?.[0]||'UNKNOWN'}。${l.explain} 請比較查到的資料，修正後重新送出。`;
return {ok,input:String(input),reason:reason.trim(),message:explanation,expected:String(expected),date:s.date,stamp:dataStamp(s)};}
function listRisk(s,p){const risks=[];for(const o of s.orders){const z=p.byOrder[o.id];if(z.status==='BLOCKED'||z.status==='CONDITIONAL')risks.push({priority:z.status==='BLOCKED'?0:1,name:`${o.id}｜${z.status==='BLOCKED'?'不能開工':'條件式待確認'}`,detail:(z.blockers||[]).join('；')||'仍需查證',owner:z.blockers.some(x=>x.includes('物料'))?'採購／倉管':z.blockers.some(x=>x.includes('品質'))?'品保':'生管／代工廠'});if(z.lateDays>0)risks.push({priority:2,name:`${o.id}｜試排可能遲交 ${z.lateDays} 天`,detail:'需確認客戶承諾與可行替代方案',owner:'生管／業務'});}if(!risks.length)risks.push({priority:3,name:'當前試排未見阻擋，不代表未來無風險',detail:'確認七日內到貨、工廠檔期與品質放行',owner:'生管'});return risks.sort((a,b)=>a.priority-b.priority);}

function makeWeekPlan(s){if(!st.planPref)return null;const ids=s.orders.map(x=>x.id),first=st.planPref;if(!ids.includes(first))return null;const alt=E.clone(s);alt.userPriority=[first,...s.userPriority.filter(x=>x!==first&&ids.includes(x)),...ids.filter(x=>x!==first&&!s.userPriority.includes(x))];return {alternative:alt,model:E.plan(alt,'user')};}
function weeklyPlanner(s){const before=E.plan(s,'user'),info=st.planPreview?makeWeekPlan(s):null,after=info?.model;const current=s.userPriority[0]||s.orders[0]?.id||'UNKNOWN';return `<div class="panel"><div class="line"><h2>MPS 週排程優先序：親自試排</h2><span class="pill info">先比較，不修改工作台</span></div><p>正常生管要先編製可行的週計畫。請選一張要優先安排的訂單，觀察其它訂單是否延後。這裡僅是<b>內部試排排序</b>，不會跳過缺料／品質限制，也不是對客戶的正式交期承諾。</p><form id="acPlanForm" class="ac-plan-form"><label class="fieldlabel">這次週計畫先試排哪張訂單？<select class="select" name="first" required>${s.orders.map(x=>`<option value="${esc(x.id)}" ${st.planPref===x.id?'selected':''}>${esc(x.id)}｜${esc(E.product(x.productId)?.name||x.productId)}｜交期 ${esc(x.due)}</option>`).join('')}</select></label><button type="submit" class="btn primary">試算優先順序的影響</button></form>${after?`<div class="ac-plan-result"><div class="ac-stat-grid inner"><div class="ac-stat"><small>目前可試排</small><strong>${before.summary.confirmed}</strong><span>筆；不代表已出貨</span></div><div class="ac-stat"><small>新順序可試排</small><strong>${after.summary.confirmed}</strong><span>筆；仍需確認限制</span></div><div class="ac-stat"><small>目前逾期風險</small><strong>${before.summary.late}</strong><span>筆</span></div><div class="ac-stat"><small>新順序逾期風險</small><strong>${after.summary.late}</strong><span>筆</span></div></div><div class="tablewrap"><table><thead><tr><th>訂單</th><th>原預估交貨日</th><th>試排交貨日</th><th>原狀態</th><th>新狀態</th><th>變化／未確認</th></tr></thead><tbody>${s.orders.map(x=>{const a=before.byOrder[x.id],b=after.byOrder[x.id],changed=a?.delivery!==b?.delivery||a?.status!==b?.status;return `<tr><td>${esc(x.id)}</td><td>${esc(a?.delivery||'UNKNOWN')}</td><td>${esc(b?.delivery||'UNKNOWN')}</td><td>${esc(a?.status||'UNKNOWN')}</td><td>${esc(b?.status||'UNKNOWN')}</td><td>${changed?'有影響':'未見變化'}${b?.blockers?.length?`<br><small>${esc(b.blockers.join('；'))}</small>`:''}</td></tr>`}).join('')}</tbody></table></div><div class="note warn topspace"><b>試算限制：</b>加班、轉廠、物流或違約成本 UNKNOWN；未確認條件不能直接當成可執行。選擇不同順序只代表產能分配的示範結果，不會修改品保與客戶承諾。</div><div class="line topspace"><button type="button" class="btn" data-ac-retry-plan>修改選擇再試算</button><button type="button" class="btn primary" data-ac-commit-plan>明確確認：套用到模擬工作台的內部排序</button></div></div>`:''}</div>`;}

const DAY_TASKS=[
 ['晨會前整理','確認昨天計畫與回報、今日應生產與交期','缺料、品質或到貨未知要先標示，不能口頭假設完成','列出今天需要查證的責任人與追蹤時間'],
 ['看物料與供應','以 BOM 和已放行庫存檢查未來三日需求','查供應商承諾與到貨可靠度，未確認則 UNKNOWN','分配採購追料與倉管盤點，可並行'],
 ['檢查委外與產能','對照廠商相容性、已承諾產能與換線','查 F-A 排程和 F-B 未確認檔期','提供維持原排、暫排或協調交期的方案'],
 ['更新進度與品質','分開記錄完成良品、在製與品保放行','檢查異常是否有責任人、追蹤時間、結案條件','向主管說明落差而非只說「很趕」'],
 ['週結算與下週預排','彙整本週已處理事項、仍有的風險','更新下一週物料、可用產能及已確認交期','完成週檢討與中期風險評估']
];
function week(s,p){const risks=listRisk(s,p),day=st.day,details=DAY_TASKS[day],complete=st.dayDone[day],checks=st.inspected['day'+day]||[];const date=E.plusWork(s.date,day);const planDay=p.timeline.filter(x=>x.day===date);return `<div class="ac-hero week"><span class="ac-eyebrow">NORMAL OPERATIONS · 不等事情出問題才管理</span><h2>模擬生管工作週</h2><p>以同一份示範訂單和庫存，練習五個工作日的「查資料 → 發現風險 → 分工 → 回報」。切換日期不會自動產生或扣除完工量，仍需在原工作台回報進度。</p></div><div class="ac-day-strip">${DAY_TASKS.map((x,i)=>`<button class="ac-day ${day===i?'current':''} ${st.dayDone[i]?'finished':''}" data-ac-day="${i}"><b>DAY ${i+1}</b><small>${esc(x[0])}</small>${st.dayDone[i]?'✓':''}</button>`).join('')}</div><div class="grid two"><div class="panel"><div class="ac-eyebrow">DAY ${day+1} · ${esc(date)}｜模擬工作日</div><h2>${esc(details[0])}</h2><p>今天的管理目標：不只處理眼前訂單，更要及早辨識未來的交期、物料與產能風險。</p><div class="ac-stat-grid inner"><div class="ac-stat"><small>今日示範排產</small><strong>${num(planDay.reduce((a,x)=>a+x.qty,0))}</strong><span>箱；不是實際完工</span></div><div class="ac-stat"><small>阻擋／條件式</small><strong>${p.summary.blocked+p.summary.conditional}</strong><span>筆需協調</span></div></div><h3>主動查核清單</h3>${details.slice(1).map((x,i)=>`<button type="button" class="ac-inspect-card" data-ac-daycheck="${i}"><b>${checks.includes(i)?'✓ 已查核':'＋ 查閱'}　${esc(x)}</b>${checks.includes(i)?`<span>${esc(i===0?'今日模擬試排總量 '+planDay.reduce((a,x)=>a+x.qty,0)+' 箱；仍要檢查良品與品保進度。':i===1?'主要風險：'+risks[0].name+'；'+risks[0].detail:'依風險分派採購、品保、業務與代工廠確認；生管負責整合追蹤。')}</span>`:''}</button>`).join('')}</div><div class="panel"><h2>你的管理判斷</h2><p>請先查閱至少兩項資料，再決定今天該追蹤哪類問題；在正常工作日也要預測下週風險。</p><form id="acDayForm"><label class="fieldlabel">今天最值得優先確認的事情<select class="select" name="focus" required><option value="">選擇一項</option><option value="quality">食安、品質或未放行限制</option><option value="material">缺料、到貨或庫存可用性</option><option value="capacity">工廠產能與檔期</option><option value="delivery">訂單交期、完成與客戶承諾</option></select></label><label class="fieldlabel">需要同步聯繫的角色<select class="select" name="owner" required><option value="">請選擇</option>${['品保','採購','倉管','業務','代工廠','主管'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="fieldlabel">下一次追蹤日期<input name="follow" class="field" type="date" min="${esc(s.date)}" required value="${esc(complete?.follow||date)}"></label><label class="fieldlabel">用數字或資料說明原因，並寫出下一步（至少 20 字）<textarea name="reason" class="field" required minlength="20" placeholder="我看到……，因此先向……查……，預定……再確認">${esc(complete?.reason||'')}</textarea></label><button class="btn primary" type="submit">保存今天的管理紀錄</button></form>${complete?`<div class="ac-result pass"><b>✓ 本日管理紀錄已保存</b><p>${esc(complete.feedback)}</p><p>追蹤：${esc(complete.follow)}；聯絡：${esc(complete.owner)}</p></div>`:''}</div></div>
<div class="panel"><div class="line"><h2>未來七天的主動風險掃描</h2><span class="pill warn">以目前工作台的試排為準</span></div>${risks.slice(0,6).map(x=>`<div class="ac-risk"><b>${esc(x.name)}</b><span>${esc(x.detail)}</span><small>建議同步詢問：${esc(x.owner)}</small></div>`).join('')}<div class="line topspace"><button class="btn" data-ac-work="orders">查產能試排</button><button class="btn" data-ac-work="materials">查 BOM 與庫存</button><button class="btn" data-ac-work="issues">查事件追蹤</button></div></div>
${weeklyPlanner(s)}<div class="grid two"><div class="panel"><h2>每週管理檢討</h2><p>選擇你認為下週最容易讓交期失準的因素，並以當前報表為依據說明。未提供的資料不要自行填成本。</p><form id="acWeekForm"><label class="fieldlabel">本週需要最先確認的整體風險<select class="select" name="risk" required><option value="">請選</option><option value="material">供應商到貨與庫存可用</option><option value="capacity">工廠可用產能與換線時間</option><option value="quality">品質放行與批次控制</option><option value="delivery">訂單與交期壓力</option></select></label><label class="fieldlabel">佐證與下週管理措施（至少 20 字）<textarea class="field" name="note" minlength="20" required>${esc(st.weekReview?.note||'')}</textarea></label><button class="btn primary" type="submit">儲存週檢討</button></form>${st.weekReview?'<div class="ac-result pass">✓ 週檢討已保存，已列入學習紀錄。</div>':''}</div><div class="panel"><h2>中期供應／產能檢討</h2><p>從未來 2～4 週的角度，想想要提前確認的瓶頸。此 DEMO 無真實供應商承諾與成本，只能建立「待確認」行動。</p><form id="acMonthForm"><label class="fieldlabel">選擇一項應提前追蹤的中期風險<select class="select" name="risk" required><option value="">請選</option><option value="material">關鍵原料前置時間與安全庫存</option><option value="factory">代工廠下一週檔期與核准產能</option><option value="shelf">批次效期與可能呆滯</option></select></label><label class="fieldlabel">提早多久確認？下一步是什麼？（至少 20 字）<textarea class="field" name="note" minlength="20" required>${esc(st.monthReview?.note||'')}</textarea></label><button class="btn primary" type="submit">儲存中期管理計畫</button></form>${st.monthReview?'<div class="ac-result pass">✓ 中期風險計畫已保存。這不是對真實供應商的正式通知。</div>':''}</div></div>`;}
const LEVELS=[
 {title:'Level 1｜能辨識流程與權責',label:'品質放行由哪個部門判定？',type:'pick',choices:[['生管','pm'],['品保／授權人員','qa'],['業務','sales']],answer:()=> 'qa',reason:'權責正確、知道越權風險'},
 {title:'Level 2｜能讀懂可用庫存',label:'目前芒果果泥已放行、扣預留的當日可用量是多少公斤？',type:'number',answer:s=>E.usable(s,'M-MANGO',s.date),reason:'帳面與可用量分離'},
 {title:'Level 3｜能展開基本 BOM',label:'SO-101 剩餘投入量需要多少公斤芒果果泥？',type:'number',answer:s=>nround(E.orderRemaining(o(s,'SO-101'))*1.4),reason:'使用剩餘待投入量而非盲用整張訂單'},
 {title:'Level 4｜能辨識不可執行計畫',label:'目前有多少筆訂單被標為禁止開工或條件式待確認？',type:'number',answer:(s,p)=>p.summary.blocked+p.summary.conditional,reason:'試排與正式承諾必須區分'},
 {title:'Level 5｜能處理品質風險',label:'發現未放行批次但客戶催出貨，先做什麼？',type:'pick',choices:[['先出貨，稍後補文件','ship'],['控制批次流向、通知品保並評估交期','hold'],['先用其它同類批次不做紀錄','replace']],answer:()=> 'hold',reason:'重大品質風險先止損，不能越權'},
 {title:'Level 6｜能同步管理四起事件',label:'依現有四件示範事件，完成各事件的等級與負責人分派（處理可並行，沒有固定步驟排序）。',type:'multi',reason:'先控制食安，其他部門同步確認；說出下次追蹤與交期影響'}
];
function levelView(s,p){const done=status().levels;return `<div class="ac-hero"><div class="ac-eyebrow">SKILL CHECK · 給自己的實務能力驗收</div><h2>六階段能力挑戰</h2><p>每一級都需要實際查數字或作出權責判斷，並寫出理由。不只看按鈕或背題目。若先前修改過工作台，題目會反映當下資料。</p></div><div class="ac-levels">${LEVELS.map((l,i)=>{const available=i===0||!!st.levels[i-1];const complete=st.levels[i];return `<div class="panel ac-level ${!available?'locked':''}"><div class="line"><h2>${esc(l.title)}</h2><span class="pill ${complete?'good':available?'info':'warn'}">${complete?'✓ 已通過':available?'可進行':'先通過前一級'}</span></div><p>${esc(l.label)}</p>${available&&!complete?`<form class="acLevelForm" data-level="${i}">${l.type==='number'?`<input class="field" type="number" step="any" name="answer" required placeholder="輸入答案">`:l.type==='pick'?`<div class="ac-radio">${l.choices.map(([label,value])=>`<label><input type="radio" name="answer" value="${esc(value)}" required>${esc(label)}</label>`).join('')}</div>`:`<div class="ac-multi">${E.MULTI_EVENTS.map(e=>`<div class="ac-multi-row"><b>${esc(e.time)} ${esc(e.name)}</b><label>事件分級<select name="p_${e.id}" class="select" required><option value="">請選</option>${['P0','P1','P2','P3'].map(q=>`<option value="${q}">${q}</option>`).join('')}</select></label><label>負責角色<select name="o_${e.id}" class="select" required><option value="">請選</option>${['品保','設備','業務','資材','採購','生管'].map(q=>`<option>${q}</option>`).join('')}</select></label></div>`).join('')}</div>`}<label class="fieldlabel">判斷依據＋協調／追蹤安排（至少 20 字）<textarea class="field" name="reason" minlength="20" required placeholder="我先……，因為……，會同步請……確認，並在……再追。"></textarea></label><button type="submit" class="btn primary">送出本級驗收</button></form>`:complete?`<div class="ac-result pass">${esc(complete.reason)}<p>已通過驗收（以提交時資料為準）。</p></div>`:'<p class="tiny">請完成前一級，再進行此關。</p>'}</div>`}).join('')}</div>${notice?`<div class="ac-result retry">${esc(notice)}</div>`:''}`;}
function glossaryView(){return `<div class="ac-hero"><span class="ac-eyebrow">專業術語 · 實務用途 · 常見誤解</span><h2>食品生管知識庫</h2><p>用台灣職場常見說法學專業名詞，每個詞都有白話說明、正式用途、例子與容易犯的錯誤。</p></div><div class="panel">${glossary.map(x=>glossaryHtml(x[0])).join('')}${sourceInfo}</div>`;}
function render(s,p){let v=st.view;if(v==='lesson'&&!st.active){st.active='m01';}return `<div class="academy">${v==='catalog'?catalog(s,p):v==='lesson'?lesson(s,p):v==='week'?week(s,p):v==='levels'?levelView(s,p):glossaryView()}${notice?`<div class="ac-flash" role="status">${esc(notice)}</div>`:''}</div>`;}
function click(event,s,p,api){const b=event.target.closest('button');if(!b)return false;
if(b.dataset.acWork){api.navigate(b.dataset.acWork);return true;}
if(b.hasAttribute('data-ac-retry-plan')){st.planPreview=false;save();api.render();return true;}
if(b.hasAttribute('data-ac-commit-plan')){const z=makeWeekPlan(s);if(!z){notice='請先試算方案。';api.render();return true;}if(!confirm('僅套用模擬工作台的排序偏好，不等於可正式開工或對客戶承諾。確認套用？'))return true;try{const opt={name:'教學週計畫排序',kind:'priority',order:z.alternative.userPriority,req:[]};const changed=E.commitOption(s,opt);api.setState(changed);notice='已更新模擬工作台內部排程偏好，仍須查看未確認與阻擋條件。';api.render();}catch(err){notice='不可套用：'+err.message;api.render();}return true;}
if(b.dataset.acGo){if(b.dataset.acLesson){st.active=b.dataset.acLesson;st.stage=1;}go(b.dataset.acGo);notice='';api.render();return true;}
if(b.dataset.acLesson){st.active=b.dataset.acLesson;st.stage=1;go('lesson');api.render();return true;}
if(b.dataset.acPhase){const to=Number(b.dataset.acPhase),l=LESSONS.find(x=>x.id===st.active);if(to<st.stage||to<=2||to===st.stage){st.stage=to;save();api.render();}else if(to>st.stage)notice='請完成目前階段後再往下。';api.render();return true;}
if(b.dataset.acStage){const l=LESSONS.find(x=>x.id===st.active);if(b.dataset.acStage==='prev'){st.stage=Math.max(1,st.stage-1);notice='';save();api.render();return true;}
if(st.stage===3&&(st.inspected[l.id]||[]).length<2){notice='請先查閱至少兩個資料來源再進入練習。';api.render();return true;}
if(st.stage===4&&(!st.answers[l.id]?.ok||st.answers[l.id]?.stamp!==dataStamp(s))){notice='請以目前工作台資料重新完成獨立練習，再查看專家回饋。';api.render();return true;}
st.stage=Math.min(6,st.stage+1);notice='';save();api.render();return true;}
if(b.dataset.acInspect!==undefined){const l=LESSONS.find(x=>x.id===st.active);const i=Number(b.dataset.acInspect);st.inspected[l.id]||=[];if(!st.inspected[l.id].includes(i))st.inspected[l.id].push(i);save();api.render();return true;}
if(b.dataset.acDay!==undefined){st.day=Number(b.dataset.acDay);notice='';save();api.render();return true;}
if(b.dataset.acDaycheck!==undefined){const key='day'+st.day;st.inspected[key]||=[];const i=Number(b.dataset.acDaycheck);if(!st.inspected[key].includes(i))st.inspected[key].push(i);save();api.render();return true;}
return false;}
function submit(event,s,p,api){const f=event.target;if(!['acPractice','acTransfer','acDayForm','acWeekForm','acMonthForm','acPlanForm'].includes(f.id)&&!f.classList.contains('acLevelForm'))return false;
event.preventDefault();const fd=new FormData(f);notice='';
if(f.id==='acPlanForm'){st.planPref=String(fd.get('first')||'');st.planPreview=true;notice='已完成週計畫試排。請比較各訂單的新舊狀態，注意成本 UNKNOWN 與阻擋條件。';save();api.render();return true;}
if(f.id==='acPractice'){const l=LESSONS.find(x=>x.id===fd.get('lesson'));if(!l)return true;st.answers[l.id]=checkPractice(l,s,p,fd.get('answer')??'',String(fd.get('reason')||''));notice=st.answers[l.id].ok?'測試結果已保存。請前往專家回饋。':'先比較資料與公式，再重新練習。';save();api.render();return true;}
if(f.id==='acTransfer'){const id=st.active,note=String(fd.get('transfer')||'').trim();if(!st.answers[id]?.ok||st.answers[id]?.stamp!==dataStamp(s)){st.stage=4;notice='工作台數字已變更，請先重新完成當前練習。';api.render();return true;}if(note.length<20){notice='請至少寫 20 字的實際決策說明。';api.render();return true;}st.notes[id]=note;st.done[id]={date:s.date,answer:st.answers[id]?.input??null};save();api.render();return true;}

if(stage===4){const variant=variants[l.id],vd=t.draft[l.id]?.variant||'',reason=t.draft[l.id]?.reason||'';content=`${reminder(l,s,p)}<div class="ac-question"><h3>${esc(l.question)}</h3><form id="coachPractice" novalidate><input type="hidden" name="lesson" value="${l.id}">${answerField(l,draft.answer??'',false)}<label class="fieldlabel" for="coach-reason">你的判斷理由（至少 12 字）<textarea id="coach-reason" name="reason" class="field" placeholder="我查到……，因此……；若有未確認資料會請……協助。">${esc(reason)}</textarea></label><div class="line"><button type="submit" class="btn primary">驗證我的答案</button><button type="button" class="btn" data-teach-hint>我需要提示</button></div></form>${pr.hint>0||pr.full?hintView(l,s,p,pr):''}</div>${valid?`<div class="coach-note success"><b>第一題已符合目前示範模型</b><p>但還需要通過一題數字或條件不同的題目，才能確認不是照抄答案。</p></div><div class="coach-variant"><h3>變化題｜重新驗證是否理解</h3><p>${esc(variant.text)}</p><form id="coachVariant" novalidate>${answerField(variant,vd,true)}<button type="submit" class="btn primary">驗證變化題</button></form>${vpass?noticeBox('success','變化題通過','不同條件下仍能正確計算／判斷，可進入專家回饋。'):''}</div>`:''}`;}

return coachFrame(l,s,p,stage,content);}
function answerField(q,value,variation){const id=variation?'coach-variant-answer':'coach-answer';if(q.type==='number')return `<label class="fieldlabel" for="${id}">請填入數字（${esc(q.unit||'')}）<input id="${id}" name="answer" inputmode="decimal" type="number" step="any" min="0" class="field ac-input" value="${esc(value)}" placeholder="只輸入數字，例如 504" aria-describedby="${id}-tip"><small id="${id}-tip">單位是 ${esc(q.unit||'數量')}；不要把箱數誤當公斤數。</small></label>`;
return `<fieldset class="coach-radio" id="${id}" tabindex="-1"><legend>選擇合理的判斷</legend>${(q.choices||[]).map(([label,key])=>`<label><input name="answer" type="radio" value="${esc(key)}" ${String(value)===String(key)?'checked':''}> ${esc(label)}</label>`).join('')}</fieldset>`;}
function hintView(l,s,p,pr){const parts=hints[l.id]||['核對題目來源資料。','再確認條件、單位與責任人。'];const detail=l.type==='number'?`將本課公式代入目前資料：${esc(l.explain)}`:`先找出題目中的關鍵權責或限制：${esc(l.explain)}`;const expected=l.answer(s,p);return `<div class="coach-note tip" role="status"><b>分層提示 ${pr.full?'｜已查看完整解法':`第 ${Math.min(pr.hint,4)} 層`}</b><p>${esc(pr.hint===1?parts[0]:pr.hint===2?parts[1]:pr.hint>=3?detail:parts[0])}</p>${pr.full?`<p><b>示範解法：</b>${esc(detail)}；此份資料的結果為「${esc(l.type==='number'?fmt(expected)+' '+(l.unit||''):l.choices.find(x=>x[1]===expected)?.[0]||'UNKNOWN')}」。</p><p>請再回答不同數字／條件的變化題，不能直接用原答案當作已掌握。</p>`:''}<div class="line"><button class="btn small" type="button" data-teach-hint>再給一點提示</button><button class="btn small" type="button" data-teach-full>直接看完整解法</button><button class="btn small" type="button" data-teach-focus="coach-answer">返回題目輸入欄位</button></div></div>`;}
function welcome(){return `<section class="panel coach-welcome" role="dialog" aria-label="第一次使用導覽"><span class="ac-eyebrow">WELCOME · 食品生管從零學習</span><h2>歡迎來到食品生管專業養成學院</h2><p>我們先學正常的生產管理，再看懂訂單、算物料、排產能、練習預防風險，最後才進入突發狀況。</p><p>完全不懂 ERP 沒關係。每一課都會告訴你下一步要按哪裡、為什麼要查，做錯也可以透過分層提示修正。</p><div class="line"><button type="button" class="btn primary" data-teach-welcome="start">開始第一課（推薦）</button><button type="button" class="btn" data-teach-welcome="skip">我已經會操作，進入工作台</button></div></section>`;}
function header(){const t=teacher();return `<div class="coach-toolbar"><span><b>學習模式：</b>${t.mode==='guide'?'新手引導':'獨立挑戰'}</span><div class="line"><button type="button" class="btn small" data-teach-mode="${t.mode==='guide'?'challenge':'guide'}">切換為${t.mode==='guide'?'獨立挑戰':'新手引導'}</button><button type="button" class="btn small" data-teach-welcome="again">重新開啟新手導覽</button><button type="button" class="btn small" data-teach-action="rounds">三輪連續決策訓練</button></div></div>`;}
const ROUND_TEXT={delay:[['供應商通知原料延遲；目前新交期 UNKNOWN。','先查缺料與既有訂單，不要只改急單優先級。'],['採購取得書面通知：果泥預計於第 4 個工作日到貨，但品質驗收尚未完成。','有了到貨預估仍不能當今日可用，應重算條件式交期。'],['供應商另提出先送 100 公斤，品保需驗收；替代配方未獲核准。','部分到貨不等於整張訂單可開工，應查淨缺與分批可行性。']],breakdown:[['F-A 今日設備停機，在製品保存條件 UNKNOWN。','先控制在製品品質與查修復時間。'],['維修通知停機延長至下一工作日，原排程須重算。','先確認新瓶頸與受影響訂單，不要擅自轉廠。'],['代工 B 已確認可用檔期，但 SO-101 有 40 箱在製，仍未取得跨廠移轉與品保核准。','比較備援時仍需先確認相容、品保與可用檔期。']],rush:[['客戶臨時要求 280 箱急單；規格已確認。','先查原料、品保與原訂單產能。'],['業務通知急單交期想再提前 1 天，正式核准 UNKNOWN。','變更需求需重新試排，不可默默改原交期。'],['主管要求提出保護既有 SO-101 的方案並列出轉廠前提。','比較不同方案的原訂單延誤與未知成本。']]};
function roundsSnapshot(scene,round,date){const x=E.initial(scene,date);if(scene==='delay'&&round>=1){x.arrivals[0].date=E.plusWork(x.date,4);x.arrivals[0].confirmed=true;x.arrivals[0].qaReleased=false;}if(scene==='delay'&&round>=2){x.arrivals.push({id:'PO-P-PARTIAL',mid:'M-PASSION',qty:100,date:E.plusWork(x.date,2),confirmed:true,qaReleased:false});}if(scene==='breakdown'&&round>=1)x.factories[0].downtime[E.plusWork(x.date,1)]=480;if(scene==='breakdown'&&round>=2)x.factories[1].confirmed=true;
if(scene==='rush'&&round>=1){const order=x.orders.find(z=>z.id==='R-900');order.due=E.date(order.due,-1);order.approval=false;}return x;}
function roundFeasibility(s,sc,opt,checked,round){
 const lacks=[],unknown=[],failed=[];
 for(const id of opt.req||[]){const fact=sc.facts.find(x=>x.id===id);if(!fact)continue;if(!checked.includes(id)){lacks.push(fact.q);continue;}
 if(sc.id==='delay'&&id==='eta'&&round>=1){unknown.push('新到貨日期已獲供應商確認，但尚未到貨與完成品保驗收');continue;}
 if(fact.value==='fail')failed.push(fact.q);else if(fact.value==='unknown')unknown.push(fact.q);
 }
 if(opt.kind==='route'){const f=s.factories.find(x=>x.id===opt.fid),ord=s.orders.find(x=>x.id===opt.oid);if(!f?.compatible.includes(ord?.productId))failed.push('產品與工廠製程不相容');if(!f?.confirmed)unknown.push('代工廠檔期未確認');if(ord?.wip||ord?.good)failed.push('已開工訂單不能未經審核直接改派');}
 if(opt.kind==='release')failed.push('未授權的品質放行禁止執行');
 if(sc.id==='delay'&&opt.id==='early')failed.push('缺少關鍵原料，調成第一優先也無法開工');
 if(sc.id==='rush'&&round>=1&&opt.id==='insert')unknown.push('提前交期尚未獲業務與主管正式核准');
 return {status:failed.length?'BLOCKED':(lacks.length||unknown.length)?'CONDITIONAL':'FEASIBLE',lacks,unknown,failed};
}
function roundFactText(scene,round,f,snap){
 if(scene==='delay'&&f.id==='eta'&&round>=1)return `已取得供應商書面到貨預計日 ${snap.arrivals[0].date}，但原料仍未入庫且未經品保放行；目前只能條件式預排。`;
 if(scene==='delay'&&f.id==='stock'&&round>=2)return `供應商另提部分先到 100 公斤（${snap.arrivals.at(-1).date}），未驗收不能算可用；原有可用原料仍不足整張訂單。`;
 if(scene==='breakdown'&&f.id==='slot'&&round>=2)return `代工 B 已確認可用檔期，但 SO-101 有在製品，轉廠需生管、品保與主管核准，不能直接改派。`;
 if(scene==='rush'&&f.id==='approval'&&round>=1)return `業務提出再提前一天的需求，尚未完成內部主管與對外承諾核准：UNKNOWN。`;
 return f.answer;
}
function roundsView(s){const t=teacher(),r=t.rounds,scene=['delay','breakdown','rush'].includes(r.scene)?r.scene:'delay',round=r.round||0,snap=roundsSnapshot(scene,round,s.date),sc=E.SCENARIOS.find(x=>x.id===scene),facts=ROUND_TEXT[scene][round],k=scene+'-'+round,checked=r.checked[k]||[],optionid=r.options[k]||'',basePlan=E.plan(snap,'user'),choice=sc.options.find(x=>x.id===optionid);if(choice)snap.checkedFacts=checked;
const cmp=choice?E.compare(snap,choice,'user'):null;const term=cmp?roundFeasibility(snap,sc,choice,checked,round):null;const rd=r.drafts?.[k]||{},log=r.logs?.[k];return `<div class="academy ac41"><div class="ac-breadcrumb"><button class="btn small" data-teach-action="catalog">← 返回課程地圖</button><span>突發狀況進階訓練 · 實際模型試算（不會修改工作台）</span></div><section class="panel"><span class="ac-eyebrow">MULTI-ROUND DECISIONS</span><h2>三輪連續決策：資訊變了，方案也要重新評估</h2><div class="coach-switch">${[['delay','原物料延遲'],['breakdown','設備故障'],['rush','客戶急單']].map(([id,label])=>`<button class="btn small ${id===scene?'primary':''}" data-teach-scene="${id}">${label}</button>`).join('')}</div><h3>第 ${round+1}／3 輪：${esc(facts[0])}</h3><p>${esc(facts[1])}</p><p>日期：${esc(snap.date)}；本區僅使用獨立虛構快照，品質限制由原引擎判斷。</p><div class="coach-counter">這輪已確認資料 ${checked.length}／${sc.facts.length}</div><div class="ac-inspect">${sc.facts.map((f,i)=>`<button class="ac-inspect-card" data-teach-round-fact="${esc(f.id)}" id="coach-roundfact-${i}"><b>${checked.includes(f.id)?'✓ 已詢問':'＋ 查詢'} ${esc(f.q)}</b>${checked.includes(f.id)?`<span>${esc(f.answer)} ${f.value==='unknown'?'（UNKNOWN：未獲確認）':''}</span>`:''}</button>`).join('')}</div><h3>比較處理方案</h3><div class="coach-options">${sc.options.map(opt=>`<button class="btn ${opt.id===optionid?'primary':''}" data-teach-round-option="${opt.id}">${esc(opt.name)}</button>`).join('')}</div>${cmp?`<div class="coach-note ${term.status==='FEASIBLE'?'success':'warning'}"><b>方案狀態：${esc(term.status)}</b><p>${esc([...term.lacks,...term.unknown,...term.failed].join('；')||'前置查證符合目前示範條件，但仍不代表客戶或品保正式核准。')}</p><p><b>換線工時：</b>原 ${cmp.oldSetupHours} 小時 → 試排 ${cmp.newSetupHours} 小時；額外成本 UNKNOWN。</p></div><div class="tablewrap"><table><thead><tr><th>訂單</th><th>原交貨日</th><th>方案交貨日</th><th>原狀態</th><th>新狀態</th><th>延誤天數變化</th></tr></thead><tbody>${cmp.rows.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.oldDelivery||'UNKNOWN')}</td><td>${esc(x.newDelivery||'UNKNOWN')}</td><td>${esc(x.oldStatus)}</td><td>${esc(x.newStatus)}</td><td>${x.oldLate??'UNKNOWN'} → ${x.newLate??'UNKNOWN'}</td></tr>`).join('')}</tbody></table></div>`:noticeBox('tip','先做試算','請先查詢關鍵資訊並選擇一個方案，再看排程前後差異。')}${cmp?`<form id="coachRoundForm" novalidate><h3>寫下這輪的處置與追蹤</h3><label class="fieldlabel">這輪先通知哪個角色？<select class="select" name="owner"><option value="">請選</option>${['採購','品保','生管','業務','設備','主管'].map(z=>`<option ${rd.owner===z?'selected':''}>${z}</option>`).join('')}</select></label><label class="fieldlabel">我的理由（至少 16 字）<textarea class="field" name="reason" placeholder="我查到了……，目前還有……未確認，因此先……">${esc(rd.reason||'')}</textarea></label><label class="fieldlabel">下次追蹤與未確認事項<input class="field" name="follow" placeholder="例如：今天 15:00 再跟採購確認到貨與品保結果" value="${esc(rd.follow||'')}"></label><button class="btn primary" type="submit">送出本輪決策，查看主管回饋</button></form>${log?noticeBox(log.status==='FEASIBLE'?'success':'warning','已記錄本輪決策',`你向${log.owner}確認；方案狀態 ${log.status}。${log.note}；下一次追蹤：${log.follow}`):''}`:''}<div class="coach-note tip"><b>主管提醒</b><p>${esc(sc.coach)}</p><p>第二輪、第三輪的條件會改變；上一輪的判斷不會自動被當作下一輪的答案。</p></div><div class="line">${t.feedback?.lesson==='rounds'?noticeBox('warning','請補齊本輪步驟',t.feedback.reason):''}${round>0?'<button class="btn" data-teach-round-nav="prev">← 上一輪</button>':''}${round<2?'<button class="btn primary" data-teach-round-nav="next">進入下一輪資訊變化 →</button>':'<button class="btn" data-teach-round-nav="reset">重新練習三輪</button>'}</div></section></div>`;}

function askQuality(issue){const old=$('#qaModal');if(old)old.remove();const box=document.createElement('div');box.className='modal-bg';box.id='qaModal';box.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="品質限制處理"><div class="line"><h2>模擬品保核准解除：${escape(issue.id)}</h2><button type="button" class="btn small" id="closeModal">關閉</button></div><p>只能在品保完成必要程序、授權核准後解除。此畫面是教學模擬，不是正式簽核。</p><form id="qaForm"><div class="controls"><label><input type="checkbox" name="batch"> 已核查異常批號與影響範圍</label><label><input type="checkbox" name="disposition"> 已依品保處置確認結果符合放行條件</label><label><input type="checkbox" name="authorized"> 已取得模擬品保授權與相關文件</label></div><label class="fieldlabel">品保處置／放行證據（至少 12 字）<textarea name="proof" required minlength="12" class="field"></textarea></label><div class="line topspace"><button class="btn primary" type="submit">依模擬品保流程解除</button><button id="cancelModal" type="button" class="btn">取消</button></div></form></div>`;document.body.appendChild(box);$('#closeModal').onclick=$('#cancelModal').onclick=()=>box.remove();$('#qaForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);try{change(E.qaResolve(s,issue.id,f.get('proof'),{batch:!!f.get('batch'),disposition:!!f.get('disposition'),authorized:!!f.get('authorized')}));box.remove();msg('已依教學模擬程序解除事件；隔離庫存仍不可使用，需另有原料批次放行程序')}catch(err){msg(err.message,true)}}}

$('#panel').addEventListener('submit',e=>{if(tab==='academy'&&A.submit(e,s,E.plan(s,strategy),{navigate,render,setState:change}))return;if(tab==='journey'&&J.submit(e,s,{navigate,render,setState:change}))return;e.preventDefault();const f=new FormData(e.target);try{
 if(e.target.id==='progressForm'){change(E.reportGood(s,f.get('oid'),f.get('good')));msg('已更新良品累計，已按差額扣料');return}
 if(e.target.id==='releaseForm'){if(!confirm('此為教學模擬：確認已由品保依公司流程正式核准放行？'))return;change(E.qaRelease(s,f.get('oid')));msg('模擬品保放行已登錄');return}
 if(e.target.id==='shipForm'){change(E.ship(s,f.get('oid'),f.get('qty')));msg('已記錄模擬出貨');return}
 if(e.target.id==='capacityForm'){const next=E.clone(s),o=next.factories.find(x=>x.id===f.get('fid')),cap=Number(f.get('capacity'));if(!Number.isInteger(cap)||cap<=0||cap>1500)throw Error('請輸入 1～1500 的整數');o.capacity=cap;next.logs.push({at:s.date,action:'產能情境調整',detail:o.id+' → '+cap+' 箱／日'});change(next);msg('已更新示範產能並重排');return}
 if(e.target.id==='issueForm'){const next=E.clone(s),id='EX-U'+String(next.issues.length+1).padStart(3,'0');next.issues.push({id,name:String(f.get('name')).trim(),orderIds:[f.get('oid')],type:'一般',severity:f.get('severity'),owner:f.get('owner'),status:'open',hardBlock:f.get('severity')==='P0',next:f.get('next'),resolution:String(f.get('resolution')).trim(),note:String(f.get('note')).trim()});next.logs.push({at:next.date,action:'建立事件',detail:id});change(next);msg('已建立新事件，P0 將先套用硬封鎖，需模擬品保程序解除');return}
 if(e.target.id==='thoughtForm'){s.learning=Object.fromEntries(['reason','protect','tradeoff','contact','follow'].map(x=>[x,String(f.get(x)||'').trim()]));let opt=selectedScene().options.find(x=>x.id===selected);feedback=E.grade(s,opt,s.triage);save();render();setTimeout(()=>$('#thoughtForm')?.scrollIntoView({block:'center',behavior:'smooth'}),30);return}
 }catch(err){if(tab!=='academy'){const field=e.target.querySelector('input[type=number],input[required],textarea[required],select[required]');showFieldIssue(field,err.message+'。請檢查此欄位及對應的訂單／物料資料，修正後重新送出。');}msg(err.message,true)}});
$$('.nav button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.nav==='academy')A.go('catalog');navigate(b.dataset.nav)}));
$('#caseSelect').addEventListener('change',e=>{if(!confirm('切換情境將重置現有案例的所有本機示範資料。已匯出備份才能保留原案例，確定切換嗎？')){render();return;}selected=null;strategy='user';change(E.initial(e.target.value,s.date));navigate('cases');msg('新案例已載入')});
$('#simDate').addEventListener('change',e=>{if(!e.target.value)return;if(!confirm('更改示範日期將重新建立本案例，原案例資料不保留。要繼續嗎？')){render();return}selected=null;strategy='user';change(E.initial(s.scenarioId,e.target.value));msg('已以新日期重新建立案例')});
$('#resetCase').onclick=()=>{if(!confirm('確定重新載入當前案例的初始狀態？此操作會清除本案例的進度、決策與事件紀錄。'))return;selected=null;strategy='user';change(E.initial(s.scenarioId,s.date));msg('已回復案例最初快照')};
$('#clearAll').onclick=()=>{if(!confirm('要清除本工具的案例資料與所有專業課程學習進度嗎？此操作不可復原，請先匯出備份。'))return;localStorage.removeItem(STORE);A.reset();selected=null;strategy='user';change(E.initial());navigate('overview');msg('已清除並恢復起始資料')};
$('#helpTop').onclick=()=>{A.go('glossary');navigate('academy')};
window.__PC_DEMO__={getState:()=>E.clone(s),getPlan:()=>E.plan(s,strategy),getTab:()=>tab,getAcademy:()=>A.state()};
save();render();
})();
</script></body></html>
